# 商店条目：提交到 awesome-dsh-plugin 的目录
#
# 1. 把 <owner> / dsh-mobile-bridge 换成你的 GitHub 账号与仓库名（仓库根目录即本项目根目录，插件包在 host/ 子目录）。
# 2. 在 https://github.com/awesome-dsh-plugin/awesome-dsh-plugin 里
#    新建 data/plugins/<owner>__dsh-mobile-bridge.yml，内容复制本文件，发 PR。
# 3. 给仓库打 dsh-plugin topic，并把 tools/pack-plugin.ps1 的产物传到 GitHub Release，
#    保证下面的 tarball 地址可用（否则把 tarball 换成 npm 上的包名）。
url: https://github.com/HelloWorldNock/dsh-mobile-bridge
name: HelloWorldNock/dsh-mobile-bridge
category: remote
tarball: https://github.com/HelloWorldNock/dsh-mobile-bridge/releases/latest/download/dsh-mobile-bridge-0.8.3.tgz
description:
  zh: "在同一局域网内用 Android 手机操作 DSH：6 位配对码建立长连接后，浏览任务、发送 prompt、审批工具调用、审阅计划并接收通知。桥接端口自带 Bearer token 鉴权，支持 UDP 自动发现与断线重连；手机不在线时审批自动回落桌面客户端。全部流量留在本地，不经过公网。"
  en: "Drive DeepSeek Harness from an Android phone on the same Wi-Fi: a 6-digit pairing code opens a token-gated bridge, then the phone lists sessions, sends prompts, approves tool calls, reviews plans and receives notifications. UDP discovery, automatic reconnect, and approval fallback to the desktop client when the phone is away. All traffic stays on the LAN."
